name: pages

# Publishes the static demo in site/ to https://aeripsen.github.io/flowsentry/.
#
# It runs only after the whole `ci` workflow has succeeded for a push to
# master, and it deploys exactly the commit that ci tested. Among other things
# that run has already (see ci.yml):
#   - retrained from a clean checkout and required artifacts/demo_flows.json
#     back byte for byte (`demo` job: provenance),
#   - rebuilt the committed curve, PR-AUC, per-family confusion and zero-day
#     means from the committed files (tests/test_demo_data.py: consistency),
#   - loaded the assembled page in headless Chromium and checked what it
#     displays against the committed files (`site` job).
# A red ci run means no deploy.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assemble the site from the committed artifacts (same code the site job checked)
        run: python scripts/check_site.py --build _site
      # the committed Evidently drift + performance report, served beside the demo
      - name: Add the Evidently report
        run: mkdir -p _site/reports && cp reports/*.html _site/reports/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

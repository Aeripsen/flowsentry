name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests scripts dashboard

      - name: Types (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -q

      - name: Business case regenerates from committed artifacts
        run: python scripts/business_case.py --verify

  # The HTTP load-test harness against a real uvicorn server, short: it has to
  # start the shipped config (scoring lock on), measure server and machine CPU,
  # record the commit, and see no failed requests.
  loadtest-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with the loadtest extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[loadtest]"
      - name: Train from the committed sample
        run: python -m flowsentry.train
      - name: Load test, 2 levels, fields checked
        run: |
          python scripts/loadtest.py --levels 1,4 --warmup 0.5 --duration 2 --payloads 200 --out /tmp/loadtest_smoke.json
          python scripts/loadtest.py --check /tmp/loadtest_smoke.json
          python -c "import json; d = json.load(open('/tmp/loadtest_smoke.json')); assert d['summary']['total_errors'] == 0; assert d['server']['arm_resolved']['score_lock'] is True, d['server']"

  # Exact-bytes reproducibility under the locked environment the numbers were
  # published from. The unlocked matrix above still enforces the PR-AUC floor
  # via the regression test; this job is the strict byte-identity contract.
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Reproduce metrics byte-identically
        run: python scripts/reproduce.py
      - name: Per-family and zero-day artifacts reproduce (retrains, env stamp ignored)
        run: python scripts/verify_derived.py

  # MLflow + Evidently from a clean checkout, in the locked environment: train
  # (logs a run), log the arm comparison, rebuild the drift/performance report,
  # then require the committed summaries to come back unchanged. The tracking
  # store and the HTML report are uploaded so a run can be opened in `mlflow ui`.
  #
  # Windows, because that is the platform the committed gbdt_comparison.json and
  # mlflow_arms.json were produced on. XGBoost is not bit-identical across
  # operating systems (its softmax calls the platform's exp()): on ubuntu the
  # xgboost_tuned arm came back with benign PR-AUC, accuracy, macro-F1 and ECE
  # different in the 4th decimal (run 36770615074), while a local Windows refit
  # reproduces all five committed values exactly. The forests and LightGBM match
  # on both, and the `reproduce` job above keeps holding metrics.json to exact
  # bytes on Linux.
  mlops:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked environment + gbdt + mlops extras (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
          pip install "lightgbm==4.7.0" "xgboost==3.3.0" "mlflow==3.16.1" "evidently==0.7.23"
      # real MLflow against a throwaway store: a run logged, read back, its model
      # reloaded, and a disagreement shown to stop the run
      - name: MLflow round-trip tests
        run: pytest -q tests/test_mlflow_roundtrip.py tests/test_evidently_html.py
      # the HTML Pages serves is not byte-reproducible (random widget ids), so its
      # embedded report data is checked value by value against the summary
      - name: Served Evidently page matches the committed summary
        run: python scripts/check_evidently_html.py
      # exits non-zero if the model reloaded from the store does not reproduce the
      # class probabilities and labels exactly on all 6,570 held-out flows
      - name: Train (logs a run to the local MLflow store)
        run: python -m flowsentry.train
      # strict: every arm must equal the committed artifact that reports it, and
      # every logged model must reload with identical predictions (exit 1 if not)
      - name: Log the model comparison to MLflow, one run per arm
        run: python scripts/track_arms.py
      - name: Evidently drift + performance report
        run: python scripts/evidently_report.py
      - name: Regenerated Evidently page matches the regenerated summary
        run: python scripts/check_evidently_html.py
      - name: The store holds the training run and the four arms
        run: |
          python - <<'EOF'
          import mlflow
          from flowsentry import tracking
          mlflow.set_tracking_uri(tracking.tracking_uri())
          train = mlflow.search_runs(experiment_names=["flowsentry-train"], output_format="list")
          arms = mlflow.search_runs(experiment_names=["flowsentry-arms"], output_format="list")
          assert len(train) == 1, train
          assert len(arms) == 4, arms
          for r in [*train, *arms]:
              assert r.data.tags["roundtrip_predictions_identical"] == "True", r.info.run_name
              assert r.data.metrics["roundtrip.max_abs_proba_diff"] == 0.0, r.info.run_name
          print("store: 1 training run + 4 arm runs, every logged model reloaded identically")
          EOF
      - name: Committed summaries regenerate exactly
        run: git diff --exit-code artifacts/metrics.json artifacts/mlflow_arms.json artifacts/evidently_summary.json
      - name: Upload the tracking store and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-store-and-evidently-report
          path: |
            mlflow.db
            reports/evidently_drift_performance.html
          retention-days: 30

  # The live demo's per-flow rows must come from the committed code: retrain
  # from this clean checkout (no model file is committed), rebuild the export,
  # and require artifacts/demo_flows.json back byte for byte.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Retrain and regenerate the demo export byte for byte
        run: python scripts/demo_data.py --verify
      - name: The retrain left the committed metrics unchanged
        run: git diff --exit-code artifacts/metrics.json

  # The page's own JavaScript, run for real: serve the site as pages.yml
  # assembles it, drive it in headless Chromium, and compare what it displays
  # with the committed artifacts (scripts/check_site.py).
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install "playwright==1.60.0"
          python -m playwright install --with-deps chromium
      - name: Check what the demo page displays
        run: python scripts/check_site.py --screenshots screenshots
      - name: Upload the phone and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-page-screenshots
          path: screenshots
          retention-days: 30

# FlowSentry local stack: the FastAPI API on 8000 and the Streamlit dashboard on
# 8501, both from the one image built here. The model is trained into the image at
# build time from the committed BCCC sample, so no data volumes are needed.
services:
  api:
    build: .
    image: flowsentry:latest
    ports:
      - "8000:8000"
    healthcheck:
      # /ready 503s until a trained model is loaded; /health is liveness-only
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build: .
    image: flowsentry:latest
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    # The image's own HEALTHCHECK probes the API on 8000, which does not run in
    # this container, so without this override the dashboard is always
    # "unhealthy" (found by scripts/compose_smoke.sh in CI). Streamlit answers
    # its own health endpoint.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
